<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1344 768" width="1344" height="768" role="img" aria-label="Five acronyms — three real, two fake">
	<defs>
		<linearGradient id="bg-hero" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#CBF3F0" stop-opacity="0.45"/>
			<stop offset="1" stop-color="#FFFFFF"/>
		</linearGradient>
		<filter id="doc-shadow" x="-15%" y="-15%" width="130%" height="130%">
			<feGaussianBlur stdDeviation="14" in="SourceAlpha"/>
			<feOffset dy="8"/>
			<feComponentTransfer><feFuncA type="linear" slope="0.22"/></feComponentTransfer>
			<feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
		</filter>
		<filter id="stamp-shadow" x="-10%" y="-10%" width="120%" height="120%">
			<feGaussianBlur stdDeviation="6" in="SourceAlpha"/>
			<feOffset dy="3"/>
			<feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
			<feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
		</filter>
	</defs>

	<rect width="1344" height="768" fill="url(#bg-hero)"/>

	<!-- Decorative dots -->
	<g fill="#2EC4B6" opacity="0.18">
		<circle cx="80" cy="80" r="7"/>
		<circle cx="1260" cy="100" r="9"/>
		<circle cx="60" cy="700" r="6"/>
		<circle cx="1280" cy="680" r="8"/>
	</g>
	<g fill="#FF9F1C" opacity="0.16">
		<circle cx="200" cy="120" r="6"/>
		<circle cx="1140" cy="640" r="5"/>
	</g>

	<!-- Top title -->
	<g font-family="Inter, system-ui, -apple-system, sans-serif" text-anchor="middle">
		<text x="672" y="90" font-size="26" font-weight="800" letter-spacing="8" fill="#2EC4B6">5 ACRONYMS · 3 REAL · 2 FAKE</text>
	</g>

	<!-- LEFT BLOCK: 3 real documents (fanned stack) -->
	<g transform="translate(380 410)">
		<!-- Doc 3 (back, slate / IADP) -->
		<g transform="rotate(-12) translate(-140 -20)" filter="url(#doc-shadow)">
			<rect x="-130" y="-180" width="260" height="360" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
			<rect x="-130" y="-180" width="260" height="56" rx="16" fill="#94A3B8"/>
			<rect x="-130" y="-148" width="260" height="24" fill="#94A3B8"/>
			<text y="-142" font-size="13" font-weight="800" letter-spacing="2" fill="#FFFFFF" text-anchor="middle" font-family="Inter, system-ui, sans-serif">REAL · LIMITED</text>
			<text y="-40" font-size="76" font-weight="900" fill="#0F172A" text-anchor="middle" font-family="Inter, system-ui, sans-serif">IADP</text>
			<text y="-5" font-size="15" font-weight="600" fill="#64748B" text-anchor="middle" font-family="Inter, system-ui, sans-serif">1943</text>
			<g transform="translate(0 90)">
				<circle r="38" fill="#94A3B8"/>
				<path d="M -16 0 L -4 12 L 18 -12" stroke="#FFFFFF" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
			</g>
		</g>

		<!-- Doc 2 (mid, orange / Vienna) -->
		<g transform="rotate(6) translate(20 -50)" filter="url(#doc-shadow)">
			<rect x="-130" y="-180" width="260" height="360" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
			<rect x="-130" y="-180" width="260" height="56" rx="16" fill="#FF9F1C"/>
			<rect x="-130" y="-148" width="260" height="24" fill="#FF9F1C"/>
			<text y="-142" font-size="13" font-weight="800" letter-spacing="2" fill="#FFFFFF" text-anchor="middle" font-family="Inter, system-ui, sans-serif">REAL · VIENNA</text>
			<text y="-40" font-size="86" font-weight="900" fill="#0F172A" text-anchor="middle" font-family="Inter, system-ui, sans-serif">IDP</text>
			<text y="-5" font-size="15" font-weight="600" fill="#64748B" text-anchor="middle" font-family="Inter, system-ui, sans-serif">1968 Convention</text>
			<g transform="translate(0 90)">
				<circle r="38" fill="#FF9F1C"/>
				<path d="M -16 0 L -4 12 L 18 -12" stroke="#FFFFFF" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
			</g>
		</g>

		<!-- Doc 1 (front, mint / Geneva — hero of heroes) -->
		<g transform="rotate(-3) translate(-30 -110)" filter="url(#doc-shadow)">
			<rect x="-140" y="-200" width="280" height="400" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
			<rect x="-140" y="-200" width="280" height="62" rx="18" fill="#2EC4B6"/>
			<rect x="-140" y="-164" width="280" height="26" fill="#2EC4B6"/>
			<text y="-160" font-size="14" font-weight="800" letter-spacing="2" fill="#FFFFFF" text-anchor="middle" font-family="Inter, system-ui, sans-serif">REAL · GENEVA</text>
			<text y="-50" font-size="96" font-weight="900" fill="#0F172A" text-anchor="middle" font-family="Inter, system-ui, sans-serif">IDP</text>
			<text y="-12" font-size="16" font-weight="600" fill="#64748B" text-anchor="middle" font-family="Inter, system-ui, sans-serif">1949 Convention</text>
			<g transform="translate(0 95)">
				<circle r="44" fill="#2EC4B6"/>
				<path d="M -20 0 L -5 16 L 22 -14" stroke="#FFFFFF" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
			</g>
		</g>
	</g>

	<!-- DIVIDER: VS -->
	<g transform="translate(770 410)" filter="url(#stamp-shadow)">
		<circle r="46" fill="#FFFFFF" stroke="#0F172A" stroke-width="3"/>
		<text y="14" font-size="34" font-weight="900" fill="#0F172A" text-anchor="middle" font-family="Inter, system-ui, sans-serif">VS</text>
	</g>

	<!-- RIGHT BLOCK: 2 fake documents -->
	<g transform="translate(1010 410)">
		<!-- Doc B (back, IDA — scam) -->
		<g transform="rotate(8) translate(50 -10)" filter="url(#doc-shadow)" opacity="0.95">
			<rect x="-110" y="-160" width="220" height="320" rx="14" fill="#FFFFFF" stroke="#FECACA" stroke-width="2"/>
			<rect x="-110" y="-160" width="220" height="48" rx="14" fill="#DC2626"/>
			<rect x="-110" y="-132" width="220" height="20" fill="#DC2626"/>
			<text y="-128" font-size="12" font-weight="800" letter-spacing="2" fill="#FFFFFF" text-anchor="middle" font-family="Inter, system-ui, sans-serif">SCAM</text>
			<text y="-30" font-size="78" font-weight="900" fill="#0F172A" text-anchor="middle" font-family="Inter, system-ui, sans-serif">IDA</text>
			<text y="0" font-size="13" font-weight="600" fill="#DC2626" text-anchor="middle" font-family="Inter, system-ui, sans-serif">"$19 instant"</text>
			<!-- Big red X across the document -->
			<g stroke="#DC2626" stroke-width="14" stroke-linecap="round" opacity="0.85">
				<line x1="-90" y1="-130" x2="90" y2="140"/>
				<line x1="90" y1="-130" x2="-90" y2="140"/>
			</g>
		</g>

		<!-- Doc A (front, IDL — marketing label, less harsh than IDA) -->
		<g transform="rotate(-6) translate(-50 -90)" filter="url(#doc-shadow)">
			<rect x="-115" y="-170" width="230" height="340" rx="16" fill="#FFFFFF" stroke="#FDE68A" stroke-width="2"/>
			<rect x="-115" y="-170" width="230" height="52" rx="16" fill="#D4A017"/>
			<rect x="-115" y="-140" width="230" height="22" fill="#D4A017"/>
			<text y="-136" font-size="12" font-weight="800" letter-spacing="2" fill="#FFFFFF" text-anchor="middle" font-family="Inter, system-ui, sans-serif">MARKETING</text>
			<text y="-32" font-size="82" font-weight="900" fill="#0F172A" text-anchor="middle" font-family="Inter, system-ui, sans-serif">IDL</text>
			<text y="0" font-size="13" font-weight="600" fill="#92681A" text-anchor="middle" font-family="Inter, system-ui, sans-serif">Not a treaty term</text>
			<g transform="translate(0 90)">
				<circle r="36" fill="#D4A017"/>
				<text y="14" font-size="44" font-weight="900" fill="#FFFFFF" text-anchor="middle" font-family="Inter, system-ui, sans-serif">?</text>
			</g>
		</g>
	</g>

	<!-- Bottom caption -->
	<g font-family="Inter, system-ui, sans-serif" text-anchor="middle">
		<text x="672" y="700" font-size="15" font-weight="600" fill="#475569">UN Treaty Series Vol. 125 · Vol. 1042 · FTC Advisory 2019</text>
	</g>
</svg>
