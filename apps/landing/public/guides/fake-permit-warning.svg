<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="Fake IDP permit warning — red X stamp on document">
	<defs>
		<linearGradient id="bg-fake" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#FEF2F2"/>
			<stop offset="0.65" stop-color="#FFFFFF"/>
			<stop offset="1" stop-color="#FFFFFF"/>
		</linearGradient>
		<filter id="booklet-shadow" x="-10%" y="-10%" width="120%" height="120%">
			<feGaussianBlur stdDeviation="10" in="SourceAlpha"/>
			<feOffset dy="8"/>
			<feComponentTransfer><feFuncA type="linear" slope="0.22"/></feComponentTransfer>
			<feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
		</filter>
	</defs>

	<rect width="800" height="800" fill="url(#bg-fake)" rx="40"/>

	<!-- Small warning triangle top-right corner -->
	<g transform="translate(680 100)">
		<path d="M 0 -32 L 28 18 L -28 18 Z" fill="#DC2626"/>
		<text y="14" font-size="32" font-weight="800" fill="#FFFFFF" text-anchor="middle" font-family="Inter, system-ui, sans-serif">!</text>
	</g>

	<!-- Booklet centered -->
	<g transform="translate(400 420)" filter="url(#booklet-shadow)">
		<!-- Booklet body -->
		<rect x="-160" y="-220" width="320" height="440" rx="16" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
		<!-- Booklet spine line -->
		<rect x="-160" y="-220" width="8" height="440" fill="#E2E8F0"/>

		<!-- Top label area -->
		<text y="-140" font-size="22" font-weight="800" fill="#0F172A" text-anchor="middle" font-family="Inter, system-ui, sans-serif">INTERNATIONAL</text>
		<text y="-108" font-size="22" font-weight="800" fill="#0F172A" text-anchor="middle" font-family="Inter, system-ui, sans-serif">DRIVING LICENSE</text>

		<!-- Fake "seal" — abstract circle with shapes -->
		<g transform="translate(0 -10)">
			<circle r="60" fill="none" stroke="#94A3B8" stroke-width="2"/>
			<circle r="50" fill="none" stroke="#94A3B8" stroke-width="1" stroke-dasharray="4 3"/>
			<polygon points="0,-30 26,15 -26,15" fill="#CBD5E1" opacity="0.7"/>
			<circle r="14" fill="#94A3B8" opacity="0.5"/>
			<text y="78" font-size="9" font-weight="700" fill="#94A3B8" text-anchor="middle" font-family="Inter, system-ui, sans-serif" letter-spacing="3">"OFFICIAL"</text>
		</g>

		<!-- Bottom fake convention reference (intentionally wrong) -->
		<text y="120" font-size="11" font-weight="600" fill="#94A3B8" text-anchor="middle" font-family="Inter, system-ui, sans-serif">NO CONVENTION REFERENCE</text>
		<text y="138" font-size="11" font-weight="600" fill="#94A3B8" text-anchor="middle" font-family="Inter, system-ui, sans-serif">NO AUTHORIZING BODY</text>

		<!-- Price stamp at bottom -->
		<g transform="translate(0 180)">
			<rect x="-50" y="-15" width="100" height="30" rx="6" fill="#FEE2E2"/>
			<text y="6" font-size="16" font-weight="800" fill="#DC2626" text-anchor="middle" font-family="Inter, system-ui, sans-serif">$19 PDF</text>
		</g>

		<!-- Diagonal red X stamp across booklet -->
		<g stroke="#DC2626" stroke-width="22" stroke-linecap="round" opacity="0.85">
			<line x1="-130" y1="-180" x2="130" y2="180"/>
			<line x1="130" y1="-180" x2="-130" y2="180"/>
		</g>

		<!-- "FAKE" text overlay -->
		<g transform="translate(0 0) rotate(-12)">
			<rect x="-110" y="-40" width="220" height="80" rx="8" fill="#DC2626"/>
			<text y="22" font-size="56" font-weight="900" fill="#FFFFFF" text-anchor="middle" font-family="Inter, system-ui, sans-serif" letter-spacing="6">FAKE</text>
		</g>
	</g>

	<!-- Caption -->
	<g font-family="Inter, system-ui, sans-serif" text-anchor="middle">
		<text x="400" y="730" font-size="14" font-weight="700" fill="#991B1B">FTC Consumer Advisory 2019</text>
		<text x="400" y="752" font-size="12" font-weight="500" fill="#94A3B8">"Beware Fake International Driver's Licenses"</text>
	</g>
</svg>
