<svg width="280" height="60" viewBox="0 0 280 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <path id="arc-top" d="M 7,30 A 23,23 0 0,1 53,30"/>
    <path id="arc-bot" d="M 5,30 A 25,25 0 0,0 55,30"/>
  </defs>

  <!-- Circle background -->
  <circle cx="30" cy="30" r="28" fill="#1a2744"/>
  <circle cx="30" cy="30" r="28" fill="none" stroke="#2a3d6e" stroke-width="1"/>

  <!-- Globe lines -->
  <circle cx="30" cy="30" r="16" fill="none" stroke="#2e4d8a" stroke-width="0.8" opacity="0.55"/>
  <ellipse cx="30" cy="30" rx="16" ry="6.5" fill="none" stroke="#2e4d8a" stroke-width="0.7" opacity="0.4"/>
  <ellipse cx="30" cy="30" rx="7.5" ry="16" fill="none" stroke="#2e4d8a" stroke-width="0.7" opacity="0.35"/>
  <line x1="14" y1="30" x2="46" y2="30" stroke="#2e4d8a" stroke-width="0.7" opacity="0.35"/>

  <!-- Location pin -->
  <circle cx="30" cy="16" r="4.5" fill="#F5C842"/>
  <path d="M 26.5 20.5 Q 25.5 27 30 26 Q 34.5 27 33.5 20.5 Z" fill="#F5C842"/>

  <!-- IDP badge -->
  <rect x="22" y="36.5" width="16" height="7.5" rx="1.8" fill="#2e4d8a"/>
  <text x="30" y="42.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="5.2" font-weight="800" fill="#F5C842" letter-spacing="1.2">IDP</text>

  <!-- COMPANION arc bottom -->
  <text font-family="Arial, Helvetica, sans-serif" font-size="3.9" font-weight="600" fill="#ffffff" letter-spacing="1.3" opacity="0.92">
    <textPath href="#arc-bot" startOffset="50%" text-anchor="middle">COMPANION</textPath>
  </text>

  <!-- FOR SMOOTHER TRAVEL arc top — radius 23 pulls it away from edge, font 4.5 -->
  <text font-family="Arial, Helvetica, sans-serif" font-size="4.5" font-weight="400" fill="#8aaad4" letter-spacing="0.7" opacity="0.9">
    <textPath href="#arc-top" startOffset="50%" text-anchor="middle">FOR SMOOTHER TRAVEL</textPath>
  </text>

  <!-- Divider -->
  <line x1="68" y1="14" x2="68" y2="46" stroke="#c8c4ba" stroke-width="1" stroke-linecap="round"/>

  <!-- Text: IDP Companion -->
  <text x="80" y="27" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1a2744" letter-spacing="0.2">IDP Companion</text>

  <!-- Text: for smoother travel -->
  <text x="80" y="41" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="400" fill="#7a8aaa" letter-spacing="0.5">for smoother travel</text>
</svg>
