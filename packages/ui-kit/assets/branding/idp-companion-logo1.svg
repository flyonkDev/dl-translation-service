<svg width="110" height="110" viewBox="0 0 110 110" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <path id="arc-top" d="M 14,55 A 41,41 0 0,1 96,55"/>
    <path id="arc-bot" d="M 15,55 A 40,40 0 0,0 95,55"/>
  </defs>

  <!-- Outer circle -->
  <circle cx="55" cy="55" r="52" fill="#1a2744"/>
  <circle cx="55" cy="55" r="52" fill="none" stroke="#2a3d6e" stroke-width="1.5"/>

  <!-- Globe lines -->
  <circle cx="55" cy="55" r="30" fill="none" stroke="#2e4d8a" stroke-width="1.1" opacity="0.55"/>
  <ellipse cx="55" cy="55" rx="30" ry="12" fill="none" stroke="#2e4d8a" stroke-width="1" opacity="0.4"/>
  <ellipse cx="55" cy="55" rx="14" ry="30" fill="none" stroke="#2e4d8a" stroke-width="1" opacity="0.35"/>
  <line x1="25" y1="55" x2="85" y2="55" stroke="#2e4d8a" stroke-width="1" opacity="0.35"/>

  <!-- Location pin -->
  <circle cx="55" cy="28" r="8" fill="#F5C842"/>
  <path d="M 48 36 Q 46 48 55 46 Q 64 48 62 36 Z" fill="#F5C842"/>

  <!-- IDP badge -->
  <rect x="40" y="67" width="30" height="13" rx="3" fill="#2e4d8a"/>
  <text x="55" y="77" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="800" fill="#F5C842" letter-spacing="2">IDP</text>

  <!-- COMPANION arc (bottom) -->
  <text font-family="Arial, Helvetica, sans-serif" font-size="6.8" font-weight="600" fill="#ffffff" letter-spacing="2.2" opacity="0.92">
    <textPath href="#arc-bot" startOffset="50%" text-anchor="middle">COMPANION</textPath>
  </text>

  <!-- FOR SMOOTHER TRAVEL arc (top) -->
  <text font-family="Arial, Helvetica, sans-serif" font-size="6.2" font-weight="400" fill="#8aaad4" letter-spacing="1.3" opacity="0.9">
    <textPath href="#arc-top" startOffset="50%" text-anchor="middle">FOR SMOOTHER TRAVEL</textPath>
  </text>
</svg>
